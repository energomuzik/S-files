# S-FILES · автопубликация на GitHub Pages (статический сайт, без сборки).
# Один раз: Settings → Pages → Source: «GitHub Actions».
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Собрать сайт в _site
        run: |
          mkdir -p _site
          [ -f index.html ] && cp index.html _site/ || true
          for d in css js assets; do
            if [ -d "$d" ]; then cp -r "$d" _site/; fi
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
